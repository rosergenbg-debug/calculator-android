name: Build APK

on:
  push:
    branches: [ "main", "fix/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Run calculator tests
        run: gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload test APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: calculator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Restore release signing key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CALCULATOR_KEYSTORE_BASE64: ${{ secrets.CALCULATOR_KEYSTORE_BASE64 }}
        run: |
          test -n "$CALCULATOR_KEYSTORE_BASE64"
          printf '%s' "$CALCULATOR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/calculator-release.jks"

      - name: Build signed release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/calculator-release.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.CALCULATOR_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: calculator
          SIGNING_KEY_PASSWORD: ${{ secrets.CALCULATOR_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "Taschenrechner-v1.${GITHUB_RUN_NUMBER}.apk"

      - name: Upload signed APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: taschenrechner-release-apk
          path: Taschenrechner-v1.*.apk
          retention-days: 90
